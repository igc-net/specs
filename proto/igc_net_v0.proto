syntax = "proto3";

package igc_net.v0;

// Normative igc-net gRPC API — v0.3.
//
// The v0 package name signals that breaking changes are allowed across minor
// versions. Regenerate clients from this file for each protocol release.

service IgcNet {
  rpc GetNodeStatus(GetNodeStatusRequest) returns (GetNodeStatusResponse);
  rpc RegisterPilot(RegisterPilotRequest) returns (RegisterPilotResponse);
  rpc ListPilots(ListPilotsRequest) returns (ListPilotsResponse);
  rpc IssuePortalAuthToken(IssuePortalAuthTokenRequest)
      returns (IssuePortalAuthTokenResponse);
  rpc PublishFlight(PublishFlightRequest) returns (PublishFlightResponse);
  rpc FetchArtifact(FetchArtifactRequest) returns (FetchArtifactResponse);
  rpc QueryIndex(QueryIndexRequest) returns (QueryIndexResponse);
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream IgcNetEvent);

  // Portal-mediated handover into igc-net private-access custody.
  rpc ProvisionPrivateAccessKey(ProvisionPrivateAccessKeyRequest)
      returns (ProvisionPrivateAccessKeyResponse);
  rpc RevokePrivateAccess(RevokePrivateAccessRequest)
      returns (RevokePrivateAccessResponse);

  // ── Groups ──────────────────────────────────────────────────────────────────

  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc AddPrivateGroupMember(AddPrivateGroupMemberRequest)
      returns (AddPrivateGroupMemberResponse);
  rpc RemovePrivateGroupMember(RemovePrivateGroupMemberRequest)
      returns (RemovePrivateGroupMemberResponse);
  rpc InviteToPublicGroup(InviteToPublicGroupRequest)
      returns (InviteToPublicGroupResponse);
  rpc AcceptGroupInvitation(AcceptGroupInvitationRequest)
      returns (AcceptGroupInvitationResponse);
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc LookupGroupByName(LookupGroupByNameRequest) returns (LookupGroupByNameResponse);
  rpc ListMyGroups(ListMyGroupsRequest) returns (ListMyGroupsResponse);
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse);
  rpc GetPendingInvitations(GetPendingInvitationsRequest)
      returns (GetPendingInvitationsResponse);

  // Portal-convenience group RPCs — authenticate via pilot_id + access_pin.
  rpc PortalCreateGroup(PortalCreateGroupRequest) returns (CreateGroupResponse);
  rpc PortalAddPrivateGroupMember(PortalAddPrivateGroupMemberRequest)
      returns (AddPrivateGroupMemberResponse);
  rpc PortalRemovePrivateGroupMember(PortalRemovePrivateGroupMemberRequest)
      returns (RemovePrivateGroupMemberResponse);
  rpc PortalInviteToPublicGroup(PortalInviteToPublicGroupRequest)
      returns (InviteToPublicGroupResponse);
  rpc PortalAcceptGroupInvitation(PortalAcceptGroupInvitationRequest)
      returns (AcceptGroupInvitationResponse);
  rpc PortalLeaveGroup(PortalLeaveGroupRequest) returns (LeaveGroupResponse);

  // ── Follow ──────────────────────────────────────────────────────────────────

  rpc FollowPilot(FollowPilotRequest) returns (FollowPilotResponse);
  rpc UnfollowPilot(UnfollowPilotRequest) returns (UnfollowPilotResponse);
  rpc ListFollowing(ListFollowingRequest) returns (ListFollowingResponse);
  rpc ListFollowers(ListFollowersRequest) returns (ListFollowersResponse);
}

// ── Shared enums ──────────────────────────────────────────────────────────────

message GetNodeStatusRequest {}

message GetNodeStatusResponse {
  string protocol_version = 1;
  string api_version = 2;
  string node_id = 3;
  // Service-level readiness. This is not proof that every pilot-specific
  // restricted-serving path is ready.
  bool ready = 4;
  GovernanceSyncState governance_sync_state = 5;
  uint64 latest_event_seq = 6;
  bool governance_baseline_ready = 7;
  bool blob_store_ready = 8;
  bool artifact_registry_ready = 9;
  bool event_cursor_ready = 10;
}

enum GovernanceSyncState {
  GOVERNANCE_SYNC_STATE_UNSPECIFIED = 0;
  GOVERNANCE_SYNC_STATE_NOT_STARTED = 1;
  GOVERNANCE_SYNC_STATE_CATCHING_UP = 2;
  GOVERNANCE_SYNC_STATE_READY = 3;
  GOVERNANCE_SYNC_STATE_STALE = 4;
  GOVERNANCE_SYNC_STATE_FAILED = 5;
}

message PublishFlightRequest {
  bytes raw_igc = 1;
  string filename = 2;
  PublicationMode publication_mode = 3;
  // Required for protected and private modes. Optional for public
  // (anonymous publish if absent). Must be a pilot registered on this node.
  string pilot_id = 4;
}

message PublishFlightResponse {
  string raw_igc_hash = 1;
  repeated PublishedArtifact artifacts = 2;
  bool g_record_present = 3;
}

message PublishedArtifact {
  ArtifactClass artifact_class = 1;
  string artifact_hash = 2;
  string ticket = 3;
}

enum PublicationMode {
  PUBLICATION_MODE_UNSPECIFIED = 0;
  PUBLICATION_MODE_PUBLIC = 1;
  PUBLICATION_MODE_PROTECTED = 2;
  PUBLICATION_MODE_PRIVATE = 3;
}

message RegisterPilotRequest {
  string display_name = 1;
  // Raw PIN transmitted over the trusted local gRPC connection.
  // Stored as an Argon2id hash by the sidecar; never persisted in plaintext.
  string access_pin = 2;
  // ISO 3166-1 alpha-2; optional.
  string country = 3;
}

message RegisterPilotResponse {
  // igcnet:id:<hex>
  string pilot_id = 1;
  // did:key:z6Mk...
  string pilot_auth_did = 2;
  string display_name = 3;
}

message ListPilotsRequest {}

message PilotSummary {
  string pilot_id = 1;
  string display_name = 2;
  string country = 3;
}

message ListPilotsResponse {
  repeated PilotSummary pilots = 1;
}

message IssuePortalAuthTokenRequest {
  string pilot_id = 1;
  // Becomes JWT aud claim.
  string portal_id = 2;
  // Unique nonce from the portal.
  string jti = 3;
  // Raw PIN for Argon2id verification.
  string access_pin = 4;
  // 0 = sidecar default (3600).
  uint32 expires_in_seconds = 5;
}

message IssuePortalAuthTokenResponse {
  // Compact W3C VC-JWT (EdDSA/Ed25519, vc+jwt). The portal verifies locally.
  string pilot_profile_vc_jwt = 1;
}

// ── Artifact fetch ────────────────────────────────────────────────────────────

// Proof embedded in FetchArtifactRequest for group-based access.
// The requester signs with their root pilot identity key (the Ed25519 key
// embedded in requester_pilot_id).  raw_igc_hash and artifact_class from the
// outer FetchArtifactRequest are included in the signing payload.
message GroupFetchProof {
  string requester_pilot_id = 1;  // igcnet:id:<hex>
  string group_id = 2;            // igcnet:group:<32-hex>
  uint64 seq_num = 3;             // monotonic, keyed by requester_pilot_id
  bytes  signature = 4;           // ed25519 over canonical JSON of the proof payload
}

message FetchArtifactRequest {
  string raw_igc_hash = 1;
  ArtifactClass artifact_class = 2;
  // Required for restricted artifact classes (protected_raw_companion, private_raw_igc)
  // when using private-access key authentication.
  // Signed over RFC-8785 canonical JSON of fields 1-4 using private_access_keypair.
  string requester_key = 3;  // ed25519 public key, lowercase hex
  uint64 seq_num = 4;        // monotonic counter; must exceed server's last-seen for requester_key
  bytes  signature = 5;      // ed25519 signature over canonical JSON of fields 1-4
  // Alternative: group-based fetch proof (mutually exclusive with fields 3-5).
  GroupFetchProof group_fetch_proof = 6;
}

message FetchArtifactResponse {
  bytes artifact_bytes = 1;
  // Hash of artifact_bytes. For public_raw_igc, protected_raw_companion, and
  // private_raw_igc this equals raw_igc_hash. For protected_sanitized_igc this
  // equals protected_hash.
  string artifact_hash = 2;
  string raw_igc_hash = 3;
  ArtifactClass artifact_class = 4;
}

enum ArtifactClass {
  ARTIFACT_CLASS_UNSPECIFIED = 0;
  ARTIFACT_CLASS_PUBLIC_RAW_IGC = 1;
  ARTIFACT_CLASS_PROTECTED_SANITIZED_IGC = 2;
  ARTIFACT_CLASS_PROTECTED_RAW_COMPANION = 3;
  ARTIFACT_CLASS_PRIVATE_RAW_IGC = 4;
}

message QueryIndexRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message QueryIndexResponse {
  repeated IndexEntry entries = 1;
  string next_page_token = 2;
}

message IndexEntry {
  string raw_igc_hash = 1;
  PublicationMode publication_mode = 2;
  optional string protected_hash = 3;
  repeated string serving_node_ids = 4;
  // Artifact classes that this service currently has local bytes for and is
  // willing to expose as locally available under the effective publication mode.
  repeated ArtifactClass locally_available_artifact_classes = 5;
  // Local governance state used for serving decisions. This is the service's
  // applied view, not a global finality proof.
  GovernanceServingState governance_serving_state = 6;
  // True only when the service currently has a locally available artifact class
  // and the applied governance view does not forbid serving.
  bool locally_fetchable = 7;
  // Latest local artifact-registry/event sequence that changed this entry.
  uint64 updated_event_seq = 8;
  // Known signature-presence signal for the raw IGC bytes. Unset means unknown,
  // not unsigned.
  optional bool g_record_present = 9;
}

enum GovernanceServingState {
  GOVERNANCE_SERVING_STATE_UNSPECIFIED = 0;
  GOVERNANCE_SERVING_STATE_UNKNOWN = 1;
  GOVERNANCE_SERVING_STATE_PENDING = 2;
  GOVERNANCE_SERVING_STATE_APPROVED = 3;
  GOVERNANCE_SERVING_STATE_CONTESTED = 4;
  GOVERNANCE_SERVING_STATE_REJECTED = 5;
  GOVERNANCE_SERVING_STATE_DELETED = 6;
  GOVERNANCE_SERVING_STATE_STALE = 7;
}

message SubscribeEventsRequest {
  // 0-based local event sequence. Delivery is at-least-once.
  uint64 from_seq = 1;
}

message IgcNetEvent {
  uint64 seq = 1;
  EventKind kind = 2;
  // Post-event local index view for the affected raw_igc_hash.
  IndexEntry entry = 3;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_LOCAL_PUBLISH = 1;
  EVENT_KIND_REMOTE_ANNOUNCEMENT = 2;
  EVENT_KIND_GOVERNANCE_UPDATE = 3;
}

message ProvisionPrivateAccessKeyRequest {
  string pilot_id = 1;
  // 32-byte Ed25519 seed for the pilot's private_access_keypair.
  bytes private_access_secret_key = 2;
  // Portal's view of the current active private_access_public_key. igc-net
  // validates this lowercase-hex public key against both the supplied secret
  // key and governance state.
  string expected_private_access_public_key = 3;
}

message ProvisionPrivateAccessKeyResponse {
  string pilot_id = 1;
  string private_access_public_key = 2;
  bool full_governance_catchup_required = 3;
  GovernanceSyncState pilot_governance_sync_state = 4;
  bool restricted_serving_ready = 5;
}

message RevokePrivateAccessRequest {
  string pilot_id = 1;
}

message RevokePrivateAccessResponse {
  string pilot_id = 1;
  // True when key material for pilot_id was deleted or was already absent.
  bool key_deleted = 2;
  // True when local restricted plaintext serving state for pilot_id has been
  // disabled and best-effort deletion has been attempted for managed storage
  // layers that support it. This is not a claim of provable physical erasure;
  // see 70-durability.md.
  bool restricted_plaintext_deleted = 3;
  // True when the service retained non-secret tombstone state to prevent
  // accidental access resurrection.
  bool tombstone_retained = 4;
}

// ── Group messages ────────────────────────────────────────────────────────────

enum GroupType {
  GROUP_TYPE_UNSPECIFIED = 0;
  GROUP_TYPE_PRIVATE = 1;
  GROUP_TYPE_PUBLIC = 2;
}

message GroupSummary {
  string group_id = 1;
  GroupType group_type = 2;
  string creator_pilot_id = 3;
  // Human-readable unique name; max 128 UTF-8 characters.
  string name = 4;
  bool is_owner = 5;
}

// CreateGroup: signed record generated client-side and submitted to node.
message CreateGroupRequest {
  // Serialised GroupCreationRecord JSON (signed by creator's root pilot key).
  string signed_record_json = 1;
}

message CreateGroupResponse {
  string group_id = 1;
}

message AddPrivateGroupMemberRequest {
  // Serialised PrivateGroupMemberAddRecord JSON.
  string signed_record_json = 1;
}

message AddPrivateGroupMemberResponse {
  string group_id = 1;
  string member_pilot_id = 2;
}

message RemovePrivateGroupMemberRequest {
  // Serialised PrivateGroupMemberRemoveRecord JSON.
  string signed_record_json = 1;
}

message RemovePrivateGroupMemberResponse {
  string group_id = 1;
  string member_pilot_id = 2;
}

message InviteToPublicGroupRequest {
  // Serialised PublicGroupInviteRecord JSON.
  string signed_record_json = 1;
}

message InviteToPublicGroupResponse {
  string group_id = 1;
  string invited_pilot_id = 2;
}

message AcceptGroupInvitationRequest {
  // Serialised PublicGroupAcceptRecord JSON.
  string signed_record_json = 1;
}

message AcceptGroupInvitationResponse {
  string group_id = 1;
  string member_pilot_id = 2;
}

message LeaveGroupRequest {
  // Serialised PublicGroupLeaveRecord JSON.
  string signed_record_json = 1;
}

message LeaveGroupResponse {
  string group_id = 1;
  string member_pilot_id = 2;
}

message ListMyGroupsRequest {
  // igcnet:id:<hex> — list groups for this pilot.
  string pilot_id = 1;
}

message ListMyGroupsResponse {
  repeated GroupSummary groups = 1;
}

message GetGroupRequest {
  string group_id = 1;
  // Optional. When provided, is_owner in the response is computed for this pilot.
  string requester_pilot_id = 2;
}

message GetGroupResponse {
  GroupSummary group = 1;
}

message LookupGroupByNameRequest {
  // Exact group name (case-sensitive). Returns NOT_FOUND if no group matches.
  string name = 1;
  // Optional. When provided, is_owner in the response is computed for this pilot.
  string requester_pilot_id = 2;
}

message LookupGroupByNameResponse {
  GroupSummary group = 1;
}

message ListGroupMembersRequest {
  string group_id = 1;
  // Required for access control. Private group member lists are owner-only;
  // public group member lists require the requester to be a current member.
  string requester_pilot_id = 2;
}

message ListGroupMembersResponse {
  string group_id = 1;
  repeated string member_pilot_ids = 2;
}

message GetPendingInvitationsRequest {
  string pilot_id = 1;
}

message GetPendingInvitationsResponse {
  // Full group summaries so callers can display group names without a second round-trip.
  repeated GroupSummary groups = 1;
}

// ── Portal-convenience group messages ────────────────────────────────────────

message PortalCreateGroupRequest {
  string pilot_id = 1;
  string access_pin = 2;
  GroupType group_type = 3;
  // Empty string means no name.
  string name = 4;
}

message PortalAddPrivateGroupMemberRequest {
  string pilot_id = 1;
  string access_pin = 2;
  string group_id = 3;
  string member_pilot_id = 4;
}

message PortalRemovePrivateGroupMemberRequest {
  string pilot_id = 1;
  string access_pin = 2;
  string group_id = 3;
  string member_pilot_id = 4;
}

message PortalInviteToPublicGroupRequest {
  string pilot_id = 1;
  string access_pin = 2;
  string group_id = 3;
  string invited_pilot_id = 4;
}

message PortalAcceptGroupInvitationRequest {
  string pilot_id = 1;
  string access_pin = 2;
  string group_id = 3;
}

message PortalLeaveGroupRequest {
  string pilot_id = 1;
  string access_pin = 2;
  string group_id = 3;
}

// ── Follow messages ───────────────────────────────────────────────────────────

message FollowPilotRequest {
  // Serialised FollowRecord JSON.
  string signed_record_json = 1;
}

message FollowPilotResponse {
  string follower_pilot_id = 1;
  string followee_pilot_id = 2;
}

message UnfollowPilotRequest {
  // Serialised UnfollowRecord JSON.
  string signed_record_json = 1;
}

message UnfollowPilotResponse {
  string follower_pilot_id = 1;
  string followee_pilot_id = 2;
}

message ListFollowingRequest {
  string pilot_id = 1;
}

message ListFollowingResponse {
  repeated string followee_pilot_ids = 1;
}

message ListFollowersRequest {
  string pilot_id = 1;
}

message ListFollowersResponse {
  repeated string follower_pilot_ids = 1;
}
